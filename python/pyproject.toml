[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "strata"
version = "0.1.0"
description = "STRATA Physics-Informed Spatio-Temporal Deep Learning Framework"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "xarray", "netCDF4", "h5netcdf", "zarr", "dask", "scikit-learn", "torch", "torchvision", "lightning", "onnx", "fastapi", "uvicorn", "pydantic>=2"]
[project.optional-dependencies]
live = ["copernicusmarine", "earthaccess", "argopy", "wandb"]
[tool.setuptools.packages.find]
where = ["."]
include = ["strata*", "api*"]
[tool.ruff]
line-length = 110
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = ["no-redef", "assignment"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=strata --cov=api --cov-report=term-missing --cov-fail-under=70 -p randomly"
